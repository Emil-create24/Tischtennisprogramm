<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tischtennis Programm</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. CENTRAL DESIGN CONFIG
       ========================================================================== */

    :root {
      --font-family: 'Plus Jakarta Sans', sans-serif;
      --max-width: 920px;
      --border-radius-card: 16px;
      --border-radius-btn: 10px;
      
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --bg-gradient: linear-gradient(-45deg, #0b0f19, #047857, #1e1b4b, #4c1d95, #0284c7, #090d16);
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --row-bg: rgba(15, 23, 42, 0.6);
      --table-th-bg: rgba(15, 23, 42, 0.85);
      
      --accent-primary: #10b981;
      --accent-primary-hover: #059669;
      --accent-warning: #f59e0b;
      --accent-danger: #ef4444;

      --rank-1: #facc15;
      --rank-2: #94a3b8;
      --rank-3: #b45309;
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(-45deg, #6ee7b7, #93c5fd, #c084fc, #f472b6, #6ee7b7);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.1);
      --text-main: #0f172a;
      --text-muted: #475569;
      --input-bg: #ffffff;
      --row-bg: rgba(241, 245, 249, 0.85);
      --table-th-bg: rgba(226, 232, 240, 0.95);
      
      --accent-primary: #059669;
      --accent-primary-hover: #047857;
      --accent-warning: #d97706;
      --accent-danger: #dc2626;

      --rank-1: #d97706;
      --rank-2: #475569;
      --rank-3: #92400e;
    }

    /* ==========================================================================
       2. LEBENDIGER HINTERGRUND & ULTRA-SMOOTHE ANIMATIONEN
       ========================================================================== */

    @keyframes liveGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translate3d(0, 20px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translate3d(-15px, 0, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.98);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes scorePulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.025); border-color: var(--accent-primary); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
      100% { transform: scale(1); }
    }

    @keyframes rowGlow {
      0% { background-color: rgba(16, 185, 129, 0.12); }
      100% { background-color: transparent; }
    }

    /* ==========================================================================
       3. ELEMENT STYLES & TRANSITIONEN
       ========================================================================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.5s var(--ease-smooth), 
                  color 0.4s var(--ease-smooth), 
                  border-color 0.4s var(--ease-smooth), 
                  transform 0.4s var(--ease-smooth), 
                  box-shadow 0.4s var(--ease-smooth),
                  opacity 0.4s var(--ease-smooth);
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    body {
      font-family: var(--font-family);
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 20px 15px;
      background: var(--bg-gradient);
      background-size: 300% 300%;
      animation: liveGradient 30s ease infinite; /* Ruhiger & flüssiger Bewegungslauf */
      min-height: 100vh;
      color: var(--text-main);
      touch-action: manipulation;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
      animation: fadeInUp 0.8s var(--ease-smooth);
    }

    h1 {
      font-weight: 800;
      font-size: 2.2rem;
      margin: 0;
      background: linear-gradient(135deg, #34d399, var(--accent-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .theme-toggle-btn {
      padding: 12px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius-btn);
      color: var(--text-main);
      cursor: pointer;
      font-weight: 600;
      user-select: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .theme-toggle-btn:active {
      transform: scale(0.97);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 24px 20px;
      border-radius: var(--border-radius-card);
      margin-bottom: 25px;
      animation: fadeInUp 0.8s var(--ease-smooth);
      box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.25);
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    input[type="text"], input[type="number"], select {
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius-btn);
      color: var(--text-main);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }

    input[type="text"]:focus, select:focus, input[type="number"]:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
    }

    input[type="text"] { flex-grow: 1; }

    button.btn-primary {
      padding: 14px 22px;
      background: var(--accent-primary);
      color: #ffffff;
      border: none;
      border-radius: var(--border-radius-btn);
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      user-select: none;
    }

    button.btn-primary:active:not(:disabled) {
      transform: scale(0.98);
      background: var(--accent-primary-hover);
    }

    button:disabled { opacity: 0.4; cursor: not-allowed; }

    ul { list-style: none; padding: 0; margin: 0; }
    
    li {
      background: var(--row-bg);
      margin: 10px 0;
      padding: 14px 18px;
      border-radius: var(--border-radius-btn);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--card-border);
      animation: slideInLeft 0.5s var(--ease-smooth);
    }

    li:active {
      transform: scale(0.995);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-danger);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }

    .btn-danger:active {
      background: var(--accent-danger);
      color: white;
      transform: scale(0.97);
    }

    .filter-box {
      background: var(--row-bg);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--card-border);
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      padding: 10px 18px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      color: var(--text-main);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      user-select: none;
    }

    .filter-btn:active {
      transform: scale(0.96);
    }

    .filter-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
    }

    .select-prompt {
      text-align: center;
      color: var(--text-muted);
      padding: 35px 15px;
      font-weight: 600;
      font-size: 1.05rem;
      background: var(--row-bg);
      border-radius: 14px;
      border: 1px dashed var(--card-border);
      animation: popIn 0.5s var(--ease-smooth);
    }

    .match-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: var(--row-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 12px;
      animation: popIn 0.5s var(--ease-smooth);
    }

    .match-row:active {
      transform: scale(0.995);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .match-row.completed-bg { 
      opacity: 0.85; 
      border-left: 4px solid var(--accent-primary);
    }

    .score-inputs {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.18);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .score-inputs input {
      width: 65px;
      min-width: 60px;
      padding: 10px 4px;
      text-align: center;
      font-weight: 800;
      font-size: 1.2rem;
    }

    .score-inputs input.pulse-anim {
      animation: scorePulse 0.6s var(--ease-smooth);
    }

    .score-player-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      display: inline-block;
      letter-spacing: 0.5px;
    }

    .badge-open {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-warning);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-done {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-primary);
      border: 1px solid rgba(16, 185, 129, 0.4);
      animation: popIn 0.5s var(--ease-smooth);
    }

    .table-wrapper { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 15px;
      min-width: 580px;
    }

    th, td { padding: 16px 12px; text-align: center; }
    th {
      background: var(--table-th-bg);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td { border-bottom: 1px solid var(--card-border); font-size: 1rem; }

    tbody tr {
      animation: fadeInUp 0.6s var(--ease-smooth);
    }

    tbody tr.updated-row {
      animation: rowGlow 1.2s var(--ease-smooth);
    }

    .rank-1 { color: var(--rank-1); font-weight: 800; font-size: 1.2rem; }
    .rank-2 { color: var(--rank-2); font-weight: 700; }
    .rank-3 { color: var(--rank-3); font-weight: 700; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>🏓 Tischtennis Programm</h1>
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">☀️ Light Mode</button>
  </div>

  <div id="setup-section" class="card">
    <h2>Spieler eintragen:</h2>
    <div class="input-group">
      <input type="text" id="player-name" placeholder="Name eintragen..." onkeydown="if(event.key==='Enter') addPlayer()">
      <button class="btn-primary" onclick="addPlayer()">Hinzufügen</button>
    </div>
    <ul id="player-list"></ul>
    <button id="start-btn" class="btn-primary" onclick="startTournament()" style="width: 100%; margin-top: 20px;" disabled>
      Spiel starten
    </button>
  </div>

  <div id="tournament-section" class="card hidden">
    <h2>Spiele & Ergebnisse</h2>
    
    <div class="filter-box">
      <span style="font-weight: 600; color: var(--text-muted);">Spieler auswählen:</span>
      <div id="player-filter-buttons" class="filter-buttons"></div>
    </div>

    <div id="matches-list"></div>
  </div>

  <div id="ranking-section" class="card hidden">
    <h2>Rangliste</h2>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Platz</th>
            <th>Name</th>
            <th>Siege</th>
            <th>Niederlagen</th>
            <th>Punkte/Gegenpunkte</th>
            <th>Satzdifferenz (+/-)</th>
          </tr>
        </thead>
        <tbody id="standings-table"></tbody>
      </table>
    </div>
    <button onclick="resetTournament()" class="btn-danger" style="margin-top: 25px; width: 100%; padding: 14px;">
      Turnier beenden & zurücksetzen
    </button>
  </div>

  <script>
    const TEXT_CONFIG = {
      selectPlayerPrompt: "⬆️ Wähle oben deinen Namen aus, um deine Spiele zu sehen.",
      openMatchesHeader: "⏳ Noch zu spielen",
      doneMatchesHeader: "✅ Bereits gespielt",
      allDoneMessage: "🎉 Alle deine Spiele absolviert!",
      noDoneMessage: "Noch keine Spiele absolviert.",
      badgeOpen: "Offen",
      badgeDone: "Beendet",
      btnDeletePlayer: "Entfernen",
      resetConfirm: "Turnier wirklich beenden? Alle aktuellen Ergebnisse gehen verloren."
    };

    let players = [];
    let matches = [];
    let selectedPlayerFilter = null;

    function toggleTheme() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      html.setAttribute('data-theme', newTheme);
      document.getElementById('theme-btn').innerHTML = newTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    }

    function sortPlayersAlphabetically() {
      players.sort((a, b) => a.localeCompare(b, 'de', { sensitivity: 'base' }));
    }

    function addPlayer() {
      const nameInput = document.getElementById('player-name');
      const name = nameInput.value.trim();
      if (name !== "" && !players.includes(name)) {
        players.push(name);
        sortPlayersAlphabetically();
        nameInput.value = "";
        renderPlayerList();
      }
    }

    function removePlayer(index) {
      players.splice(index, 1);
      renderPlayerList();
    }

    function renderPlayerList() {
      const list = document.getElementById('player-list');
      list.innerHTML = "";
      players.forEach((p, idx) => {
        list.innerHTML += `
          <li>
            <span><strong>${p}</strong></span>
            <button class="btn-danger" onclick="removePlayer(${idx})">${TEXT_CONFIG.btnDeletePlayer}</button>
          </li>`;
      });
      document.getElementById('start-btn').disabled = players.length < 2;
    }

    function startTournament() {
      matches = [];
      selectedPlayerFilter = null;
      sortPlayersAlphabetically();

      for (let i = 0; i < players.length; i++) {
        for (let j = i + 1; j < players.length; j++) {
          matches.push({
            p1: players[i],
            p2: players[j],
            score1: '',
            score2: '',
            completed: false
          });
        }
      }

      renderFilterButtons();

      document.getElementById('setup-section').classList.add('hidden');
      
      const tournSection = document.getElementById('tournament-section');
      const rankSection = document.getElementById('ranking-section');
      
      tournSection.classList.remove('hidden');
      rankSection.classList.remove('hidden');

      renderMatches();
      updateStandings();
    }

    function renderFilterButtons() {
      const container = document.getElementById('player-filter-buttons');
      let html = "";
      
      players.forEach(p => {
        const isActive = selectedPlayerFilter === p ? 'active' : '';
        const safeName = p.replace(/'/g, "\\'");
        html += `<button class="filter-btn ${isActive}" onclick="setPlayerFilter('${safeName}')">${p}</button>`;
      });

      container.innerHTML = html;
    }

    function setPlayerFilter(player) {
      if (selectedPlayerFilter === player) {
        selectedPlayerFilter = null;
      } else {
        selectedPlayerFilter = player;
      }
      renderFilterButtons();
      renderMatches();
    }

    function renderMatches() {
      const container = document.getElementById('matches-list');
      const selectedPlayer = selectedPlayerFilter;
      container.innerHTML = "";

      if (!selectedPlayer) {
        container.innerHTML = `<div class="select-prompt">${TEXT_CONFIG.selectPlayerPrompt}</div>`;
        return;
      }

      let indexedMatches = matches.map((m, idx) => ({ ...m, originalIndex: idx }));
      const playerMatches = indexedMatches.filter(m => m.p1 === selectedPlayer || m.p2 === selectedPlayer);
      const openMatches = playerMatches.filter(m => !m.completed);
      const doneMatches = playerMatches.filter(m => m.completed);

      let html = `<h3 style="margin-top:15px; color:var(--text-muted);">${TEXT_CONFIG.openMatchesHeader} (${openMatches.length})</h3>`;
      if (openMatches.length === 0) {
        html += `<p style="color: var(--accent-primary); font-weight: 600;">${TEXT_CONFIG.allDoneMessage}</p>`;
      } else {
        openMatches.forEach(m => {
          html += createMatchRowHTML(m, selectedPlayer);
        });
      }

      html += `<h3 style="margin-top:25px; color:var(--text-muted);">${TEXT_CONFIG.doneMatchesHeader} (${doneMatches.length})</h3>`;
      if (doneMatches.length === 0) {
        html += `<p style="color: var(--text-muted);">${TEXT_CONFIG.noDoneMessage}</p>`;
      } else {
        doneMatches.forEach(m => {
          html += createMatchRowHTML(m, selectedPlayer);
        });
      }
      container.innerHTML = html;
    }

    function createMatchRowHTML(m, focusPlayer = null) {
      const bgClass = m.completed ? 'completed-bg' : '';
      const badge = m.completed 
        ? `<span class="badge badge-done">${TEXT_CONFIG.badgeDone}</span>` 
        : `<span class="badge badge-open">${TEXT_CONFIG.badgeOpen}</span>`;

      let label = `<strong>${m.p1}</strong> vs <strong>${m.p2}</strong>`;
      if (focusPlayer) {
        const opponent = (m.p1 === focusPlayer) ? m.p2 : m.p1;
        label = `Gegen <strong>${opponent}</strong>`;
      }

      return `
        <div class="match-row ${bgClass}">
          <div class="match-info">
            ${label} ${badge}
          </div>
          <div class="score-inputs">
            <span class="score-player-label" title="${m.p1}">${m.p1}</span>
            <input type="number" id="input-${m.originalIndex}-1" min="0" value="${m.score1}" placeholder="0" onchange="updateScore(${m.originalIndex}, 1, this.value)">
            <span style="color: var(--text-muted); font-weight: bold;">:</span>
            <input type="number" id="input-${m.originalIndex}-2" min="0" value="${m.score2}" placeholder="0" onchange="updateScore(${m.originalIndex}, 2, this.value)">
            <span class="score-player-label" title="${m.p2}">${m.p2}</span>
          </div>
        </div>
      `;
    }

    function updateScore(matchIndex, playerNum, val) {
      const match = matches[matchIndex];
      if (playerNum === 1) match.score1 = val === '' ? '' : parseInt(val);
      if (playerNum === 2) match.score2 = val === '' ? '' : parseInt(val);

      match.completed = (match.score1 !== '' && match.score2 !== '' && !isNaN(match.score1) && !isNaN(match.score2));

      const inputEl = document.getElementById(`input-${matchIndex}-${playerNum}`);
      if (inputEl) {
        inputEl.classList.add('pulse-anim');
        setTimeout(() => inputEl.classList.remove('pulse-anim'), 600);
      }
      
      renderMatches();
      updateStandings();
    }

    function updateStandings() {
      let stats = {};
      players.forEach(p => {
        stats[p] = { name: p, wins: 0, losses: 0, setsWon: 0, setsLost: 0 };
      });

      matches.forEach(m => {
        if (m.completed) {
          const s1 = m.score1;
          const s2 = m.score2;

          stats[m.p1].setsWon += s1;
          stats[m.p1].setsLost += s2;
          stats[m.p2].setsWon += s2;
          stats[m.p2].setsLost += s1;

          if (s1 > s2) {
            stats[m.p1].wins += 1;
            stats[m.p2].losses += 1;
          } else if (s2 > s1) {
            stats[m.p2].wins += 1;
            stats[m.p1].losses += 1;
          }
        }
      });

      let standings = Object.values(stats);

      standings.sort((a, b) => {
        if (b.wins !== a.wins) return b.wins - a.wins;
        const diffA = a.setsWon - a.setsLost;
        const diffB = b.setsWon - b.setsLost;
        if (diffB !== diffA) return diffB - diffA;
        return b.setsWon - a.setsWon;
      });

      const tbody = document.getElementById('standings-table');
      tbody.innerHTML = "";

      standings.forEach((st, idx) => {
        const diff = st.setsWon - st.setsLost;
        const diffStr = diff > 0 ? `+${diff}` : diff;
        let rankClass = "";
        if (idx === 0) rankClass = "rank-1";
        else if (idx === 1) rankClass = "rank-2";
        else if (idx === 2) rankClass = "rank-3";

        tbody.innerHTML += `
          <tr class="updated-row">
            <td class="${rankClass}">#${idx + 1}</td>
            <td><strong>${st.name}</strong></td>
            <td style="color: var(--accent-primary); font-weight: 700;">${st.wins}</td>
            <td style="color: var(--accent-danger);">${st.losses}</td>
            <td>${st.setsWon} : ${st.setsLost}</td>
            <td><strong>${diffStr}</strong></td>
          </tr>
        `;
      });
    }

    function resetTournament() {
      if (confirm(TEXT_CONFIG.resetConfirm)) {
        players = [];
        matches = [];
        selectedPlayerFilter = null;
        document.getElementById('setup-section').classList.remove('hidden');
        document.getElementById('tournament-section').classList.add('hidden');
        document.getElementById('ranking-section').classList.add('hidden');
        renderPlayerList();
      }
    }
  </script>
</body>
</html>
